name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build-only dry run or separately authorized candidate publication
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish-candidate
      authorization:
        description: For publication only, enter PUBLISH 0.4.0-rc.1
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  complete-ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the source revision
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate production dependencies
        run: pnpm audit:prod

      - name: Check cross-surface release consistency
        run: pnpm release:check

      - name: Validate source and immutable release Compose definitions
        env:
          ODOVI_WEB_DIGEST: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          ODOVI_WORKER_DIGEST: sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        run: |
          pnpm test:compose-config
          ODOVI_ENV_FILE="$GITHUB_WORKSPACE/tests/runtime-config/required.env" \
            docker compose --env-file tests/runtime-config/required.env \
              --file release/0.4.0/docker-compose.yml config --quiet
          ODOVI_ENV_FILE="$GITHUB_WORKSPACE/tests/runtime-config/optional.env" \
            docker compose --env-file tests/runtime-config/optional.env \
              --file release/0.4.0/docker-compose.yml config --quiet

  build-validation:
    needs: [complete-ci, release-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            platform: linux/amd64
            arch: amd64
            dockerfile: apps/web/Dockerfile
          - image: web
            platform: linux/arm64
            arch: arm64
            dockerfile: apps/web/Dockerfile
          - image: worker
            platform: linux/amd64
            arch: amd64
            dockerfile: apps/worker/Dockerfile
          - image: worker
            platform: linux/arm64
            arch: arm64
            dockerfile: apps/worker/Dockerfile

    steps:
      - name: Check out the gated source revision
        uses: actions/checkout@v4

      - name: Read release identity
        id: release
        run: |
          echo "version=$(node -p 'require("./release/0.4.0/release.json").version')" >> "$GITHUB_OUTPUT"
          echo "candidate=$(node -p 'require("./release/0.4.0/release.json").candidate')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build one architecture without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          build-args: |
            ODOVI_VERSION=${{ steps.release.outputs.version }}
            ODOVI_COMMIT_SHA=${{ github.sha }}
          tags: local/odovi-${{ matrix.image }}:${{ steps.release.outputs.candidate }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Verify architecture and release labels
        run: |
          node scripts/verify-release-image.mjs \
            "local/odovi-${{ matrix.image }}:${{ steps.release.outputs.candidate }}-${{ matrix.arch }}" \
            "${{ steps.release.outputs.version }}" \
            "${{ github.sha }}" \
            "${{ matrix.platform }}" \
            "build-evidence-${{ matrix.image }}-${{ matrix.arch }}.json"

      - name: Upload build evidence
        uses: actions/upload-artifact@v4
        with:
          name: build-evidence-${{ matrix.image }}-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build-evidence-${{ matrix.image }}-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 14

  dry-run-acceptance:
    if: inputs.mode == 'dry-run'
    needs: [complete-ci, release-gates]
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out the gated source revision
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install acceptance dependencies
        run: npm ci --prefix acceptance/release-stack

      - name: Install Chromium
        run: npm exec --prefix acceptance/release-stack -- playwright install --with-deps chromium

      - name: Run source-built release acceptance without publication
        env:
          ODOVI_ACCEPTANCE_VERSION: 0.4.0
          ODOVI_ACCEPTANCE_RUN_ID: dry-run-${{ github.run_id }}-${{ github.run_attempt }}
          ODOVI_EXPECT_TESLAMATE_COMPAT: "1"
        run: ./scripts/release-acceptance.sh

      - name: Upload dry-run acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          path: acceptance-results/**/manifest.json
          if-no-files-found: error
          retention-days: 14

  publish-candidate:
    if: inputs.mode == 'publish-candidate'
    needs: [complete-ci, release-gates, build-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            dockerfile: apps/web/Dockerfile
            repository: ghcr.io/jsc2304/odovi-web
          - image: worker
            dockerfile: apps/worker/Dockerfile
            repository: ghcr.io/jsc2304/odovi-worker

    steps:
      - name: Require explicit publication authorization on main
        env:
          AUTHORIZATION: ${{ inputs.authorization }}
        run: |
          test "${{ github.ref }}" = "refs/heads/main"
          test "$AUTHORIZATION" = "PUBLISH 0.4.0-rc.1"

      - name: Check out the gated source revision
        uses: actions/checkout@v4

      - name: Read release identity
        id: release
        run: |
          echo "version=$(node -p 'require("./release/0.4.0/release.json").version')" >> "$GITHUB_OUTPUT"
          echo "candidate=$(node -p 'require("./release/0.4.0/release.json").candidate')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the candidate multi-architecture image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            ODOVI_VERSION=${{ steps.release.outputs.version }}
            ODOVI_COMMIT_SHA=${{ github.sha }}
          tags: ${{ matrix.repository }}:${{ steps.release.outputs.candidate }}
          cache-from: type=gha,scope=${{ matrix.image }}-publish
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-publish

      - name: Record the published manifest digest
        env:
          IMAGE_NAME: ${{ matrix.image }}
          REPOSITORY: ${{ matrix.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          node -e 'const fs=require("fs"); const [image,repository,digest]=process.argv.slice(1); fs.writeFileSync("published-"+image+".json", JSON.stringify({image,repository,digest}, null, 2)+"\n")' \
            "$IMAGE_NAME" "$REPOSITORY" "$DIGEST"

      - name: Upload the published digest
        uses: actions/upload-artifact@v4
        with:
          name: published-${{ matrix.image }}-${{ github.sha }}-${{ github.run_attempt }}
          path: published-${{ matrix.image }}.json
          if-no-files-found: error
          retention-days: 30

  candidate-acceptance:
    needs: publish-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out the published source revision
        uses: actions/checkout@v4

      - name: Download published digests
        uses: actions/download-artifact@v4
        with:
          pattern: published-*-${{ github.sha }}-${{ github.run_attempt }}
          path: published
          merge-multiple: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install acceptance dependencies
        run: npm ci --prefix acceptance/release-stack

      - name: Install Chromium
        run: npm exec --prefix acceptance/release-stack -- playwright install --with-deps chromium

      - name: Log in to GHCR for candidate acceptance
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run acceptance against the published candidate digests
        env:
          ODOVI_ACCEPTANCE_BUILD: "0"
          ODOVI_ACCEPTANCE_VERSION: 0.4.0
          ODOVI_ACCEPTANCE_RUN_ID: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          ODOVI_EXPECT_TESLAMATE_COMPAT: "1"
        run: |
          web_digest="$(node -p 'require("./published/published-web.json").digest')"
          worker_digest="$(node -p 'require("./published/published-worker.json").digest')"
          export ODOVI_WEB_IMAGE="ghcr.io/jsc2304/odovi-web@$web_digest"
          export ODOVI_WORKER_IMAGE="ghcr.io/jsc2304/odovi-worker@$worker_digest"
          ./scripts/release-acceptance.sh

      - name: Verify exact candidate labels on both architectures
        run: |
          web_digest="$(node -p 'require("./published/published-web.json").digest')"
          worker_digest="$(node -p 'require("./published/published-worker.json").digest')"
          evidence_dir="acceptance-results/candidate-${{ github.run_id }}-${{ github.run_attempt }}"
          for image in web worker; do
            if test "$image" = web; then digest="$web_digest"; else digest="$worker_digest"; fi
            reference="ghcr.io/jsc2304/odovi-$image@$digest"
            node scripts/verify-release-image.mjs \
              "$reference" "0.4.0" "${{ github.sha }}" linux/amd64 \
              "$evidence_dir/exact-$image-amd64.json"
            # The classic image store cannot bind one index digest to two
            # architectures. Acceptance containers have already been removed;
            # release only this runner-local reference before pulling arm64.
            # https://docs.docker.com/reference/cli/docker/image/rm/
            docker image rm --no-prune "$reference"
            docker pull --platform linux/arm64 "$reference"
            node scripts/verify-release-image.mjs \
              "$reference" "0.4.0" "${{ github.sha }}" linux/arm64 \
              "$evidence_dir/exact-$image-arm64.json"
          done

      - name: Upload candidate acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            acceptance-results/**/manifest.json
            acceptance-results/**/exact-*.json
          if-no-files-found: error
          retention-days: 30

  record-candidate:
    needs: [publish-candidate, candidate-acceptance]
    runs-on: ubuntu-latest

    steps:
      - name: Check out the candidate source revision
        uses: actions/checkout@v4

      - name: Download published digests
        uses: actions/download-artifact@v4
        with:
          pattern: published-*-${{ github.sha }}-${{ github.run_attempt }}
          path: published
          merge-multiple: true

      - name: Download candidate acceptance evidence
        uses: actions/download-artifact@v4
        with:
          name: candidate-acceptance-${{ github.sha }}-${{ github.run_attempt }}
          path: acceptance

      - name: Create the immutable candidate record
        run: |
          web_digest="$(node -p 'require("./published/published-web.json").digest')"
          worker_digest="$(node -p 'require("./published/published-worker.json").digest')"
          acceptance_manifest="$(find acceptance -name manifest.json -type f -print -quit)"
          test -n "$acceptance_manifest"
          node scripts/create-release-candidate.mjs \
            release/0.4.0/release.json \
            "${{ github.sha }}" \
            "$web_digest" \
            "$worker_digest" \
            "$acceptance_manifest" \
            release-candidate.json

      - name: Upload the candidate record
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: release-candidate.json
          if-no-files-found: error
          retention-days: 90
