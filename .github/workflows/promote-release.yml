name: Promote Stable Release

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Release Candidate workflow run containing the accepted record
        required: true
        type: string
      candidate_run_attempt:
        description: Exact successful attempt number from the Release Candidate run
        required: true
        type: string
      authorization:
        description: Enter PROMOTE 0.3.0 to publish stable tags and a GitHub Release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: promote-stable-0.3.0
  cancel-in-progress: false

jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Downloading artifacts from a different workflow run requires this scope.
      # https://github.com/actions/download-artifact/tree/v4#download-artifacts-from-other-workflow-runs-or-repositories
      actions: read
    outputs:
      source_commit: ${{ steps.candidate.outputs.source_commit }}
      web_digest: ${{ steps.candidate.outputs.web_digest }}
      worker_digest: ${{ steps.candidate.outputs.worker_digest }}

    steps:
      - name: Require explicit authorization and exact run coordinates
        env:
          AUTHORIZATION: ${{ inputs.authorization }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
        run: |
          test "${{ github.ref }}" = "refs/heads/main"
          test "$AUTHORIZATION" = "PROMOTE 0.3.0"
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]

      - name: Download candidate record from the selected run
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.candidate_run_id }}
          pattern: release-candidate-*-${{ inputs.candidate_run_attempt }}
          path: ${{ runner.temp }}/candidate
          merge-multiple: true

      - name: Read candidate source revision
        id: source
        run: echo "commit=$(node -p 'require("${{ runner.temp }}/candidate/release-candidate.json").sourceCommit')" >> "$GITHUB_OUTPUT"

      - name: Check out the exact candidate source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.commit }}

      - name: Recheck release consistency and candidate acceptance
        run: |
          node scripts/check-release-consistency.mjs release/0.3.0/release.json
          node scripts/verify-release-candidate.mjs \
            release/0.3.0/release.json \
            "${{ runner.temp }}/candidate/release-candidate.json" \
            "${{ github.repository }}"

      - name: Export accepted identity
        id: candidate
        run: |
          {
            echo "source_commit=$(node -p 'require("${{ runner.temp }}/candidate/release-candidate.json").sourceCommit')"
            echo "web_digest=$(node -p 'require("${{ runner.temp }}/candidate/release-candidate.json").images.web.digest')"
            echo "worker_digest=$(node -p 'require("${{ runner.temp }}/candidate/release-candidate.json").images.worker.digest')"
          } >> "$GITHUB_OUTPUT"

      - name: Render the immutable Compose release asset
        run: |
          mkdir -p stable-assets
          node scripts/render-release-compose.mjs \
            release/0.3.0/docker-compose.yml \
            "${{ steps.candidate.outputs.web_digest }}" \
            "${{ steps.candidate.outputs.worker_digest }}" \
            stable-assets/odovi-0.3.0-docker-compose.yml
          cp "${{ runner.temp }}/candidate/release-candidate.json" stable-assets/release-candidate.json

      - name: Upload verified stable assets
        uses: actions/upload-artifact@v4
        with:
          name: stable-assets-0.3.0-${{ github.run_attempt }}
          path: stable-assets/
          if-no-files-found: error
          retention-days: 90

  promote:
    needs: verify-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out the accepted source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-candidate.outputs.source_commit }}

      - name: Download verified stable assets
        uses: actions/download-artifact@v4
        with:
          name: stable-assets-0.3.0-${{ github.run_attempt }}
          path: stable-assets

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote accepted digests without rebuilding
        run: |
          docker buildx imagetools create \
            --tag ghcr.io/jsc2304/odovi-web:0.3.0 \
            "ghcr.io/jsc2304/odovi-web@${{ needs.verify-candidate.outputs.web_digest }}"
          docker buildx imagetools create \
            --tag ghcr.io/jsc2304/odovi-worker:0.3.0 \
            "ghcr.io/jsc2304/odovi-worker@${{ needs.verify-candidate.outputs.worker_digest }}"

      - name: Publish the GitHub Release from the same source revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.3.0 \
            --target "${{ needs.verify-candidate.outputs.source_commit }}" \
            --title "Odovi 0.3.0" \
            --notes-file docs/releases/0.3.0.md \
            stable-assets/odovi-0.3.0-docker-compose.yml \
            stable-assets/release-candidate.json
