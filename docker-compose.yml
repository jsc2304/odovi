# Odovi — production deployment (Docker Compose).
#
# Runs the odovi app stack (db, one-shot migration, web, sync worker)
# against an EXISTING TeslaMate installation's Postgres, reached read-only.
# See README.md "Deployment" for the full runbook.
#
# TeslaMate connectivity — two options for TESLAMATE_DATABASE_URL in .env:
#   (a) Same Docker host, TeslaMate on a shared Docker network:
#       set TESLAMATE_DATABASE_URL=postgres://odovi_ro:...@teslamate-db:5432/teslamate
#       and uncomment the `networks:` stanzas below (external teslamate_default).
#   (b) TeslaMate reachable over LAN/VPN (e.g. Tailscale) as a plain host:
#       set TESLAMATE_DATABASE_URL=postgres://odovi_ro:...@teslamate-host.example:5432/teslamate
#       — no extra network config needed, this is the default assumption below.

services:
  config-check:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        ODOVI_VERSION: ${ODOVI_VERSION:-0.3.0}
        ODOVI_COMMIT_SHA: ${ODOVI_COMMIT_SHA:-dev}
    image: odovi-worker:latest
    command: ["node", "../../packages/runtime-config/dist/check.js"]
    restart: "no"
    # env_file lets the validator diagnose unknown keys as well as validate
    # the effective values below. ODOVI_ENV_FILE supports acceptance fixtures.
    env_file:
      - ${ODOVI_ENV_FILE:-.env}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TESLAMATE_DATABASE_URL: ${TESLAMATE_DATABASE_URL:?Set TESLAMATE_DATABASE_URL in .env}
      ODOVI_DB_USER: ${ODOVI_DB_USER:-odovi}
      ODOVI_DB_NAME: ${ODOVI_DB_NAME:-odovi}
      ODOVI_DB_VOLUME_NAME: ${ODOVI_DB_VOLUME_NAME:-odovi-db-data}
      WEB_PORT: ${WEB_PORT:-3000}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Zurich}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-60}
      ODOVI_SETUP_TOKEN: ${ODOVI_SETUP_TOKEN:-}
      FORCE_SECURE_COOKIES: ${FORCE_SECURE_COOKIES:-false}
      ELEVATION_MAX_POINTS_PER_CYCLE: ${ELEVATION_MAX_POINTS_PER_CYCLE:-}
      TESLA_CLIENT_ID: ${TESLA_CLIENT_ID:-}
      TESLA_CLIENT_SECRET: ${TESLA_CLIENT_SECRET:-}
      TESLA_REDIRECT_URI: ${TESLA_REDIRECT_URI:-}
      TESLA_PARTNER_DOMAIN: ${TESLA_PARTNER_DOMAIN:-}
      TESLA_TOKEN_ENCRYPTION_KEY: ${TESLA_TOKEN_ENCRYPTION_KEY:-}
      TESLA_PUBLIC_KEY_PEM_BASE64: ${TESLA_PUBLIC_KEY_PEM_BASE64:-}
      TESLA_COMMAND_PROXY_URL: ${TESLA_COMMAND_PROXY_URL:-}
      TESLA_COMMAND_API_URL: ${TESLA_COMMAND_API_URL:-}
      TESLA_FLEET_API_BASE_URL: ${TESLA_FLEET_API_BASE_URL:-}
      ODOVI_LOCATION_PROVIDER_WEATHER_CREDENTIAL: ${ODOVI_LOCATION_PROVIDER_WEATHER_CREDENTIAL:-}
      ODOVI_LOCATION_PROVIDER_ELEVATION_CREDENTIAL: ${ODOVI_LOCATION_PROVIDER_ELEVATION_CREDENTIAL:-}
      ODOVI_LOCATION_PROVIDER_MAP_TILES_CREDENTIAL: ${ODOVI_LOCATION_PROVIDER_MAP_TILES_CREDENTIAL:-}
      ODOVI_LOCATION_PROVIDER_ADDRESS_SEARCH_CREDENTIAL: ${ODOVI_LOCATION_PROVIDER_ADDRESS_SEARCH_CREDENTIAL:-}
      ODOVI_LOCATION_PROVIDER_ROUTING_CREDENTIAL: ${ODOVI_LOCATION_PROVIDER_ROUTING_CREDENTIAL:-}
      ODOVI_LOCATION_PROVIDER_EXTERNAL_NAVIGATION_CREDENTIAL: ${ODOVI_LOCATION_PROVIDER_EXTERNAL_NAVIGATION_CREDENTIAL:-}

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ODOVI_DB_USER:-odovi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${ODOVI_DB_NAME:-odovi}
    volumes:
      - odovi-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${ODOVI_DB_USER:-odovi} -d ${ODOVI_DB_NAME:-odovi}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No published port — only reachable from other services on this network.

  migrate:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        ODOVI_VERSION: ${ODOVI_VERSION:-0.3.0}
        ODOVI_COMMIT_SHA: ${ODOVI_COMMIT_SHA:-dev}
    image: odovi-worker:latest
    command: ["node", "dist/migrate.js"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://${ODOVI_DB_USER:-odovi}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${ODOVI_DB_NAME:-odovi}
    depends_on:
      config-check:
        condition: service_completed_successfully
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        ODOVI_VERSION: ${ODOVI_VERSION:-0.3.0}
        ODOVI_COMMIT_SHA: ${ODOVI_COMMIT_SHA:-dev}
    image: odovi-web:latest
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://${ODOVI_DB_USER:-odovi}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${ODOVI_DB_NAME:-odovi}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Zurich}
      ODOVI_SETUP_TOKEN: ${ODOVI_SETUP_TOKEN:-}
      FORCE_SECURE_COOKIES: ${FORCE_SECURE_COOKIES:-false}
      # Optional, nur für die Verbindungs-Diagnose in Settings (read-only
      # Testquery). Im Normalbetrieb liest ausschließlich der Worker die
      # TeslaMate-DB — dieser Wert kann leer bleiben.
      TESLAMATE_DATABASE_URL: ${TESLAMATE_DATABASE_URL:-}
      TESLA_CLIENT_ID: ${TESLA_CLIENT_ID:-}
      TESLA_CLIENT_SECRET: ${TESLA_CLIENT_SECRET:-}
      TESLA_REDIRECT_URI: ${TESLA_REDIRECT_URI:-}
      TESLA_PARTNER_DOMAIN: ${TESLA_PARTNER_DOMAIN:-}
      TESLA_TOKEN_ENCRYPTION_KEY: ${TESLA_TOKEN_ENCRYPTION_KEY:-}
      TESLA_PUBLIC_KEY_PEM_BASE64: ${TESLA_PUBLIC_KEY_PEM_BASE64:-}
      TESLA_COMMAND_PROXY_URL: ${TESLA_COMMAND_PROXY_URL:-}
      TESLA_COMMAND_API_URL: ${TESLA_COMMAND_API_URL:-}
      TESLA_FLEET_API_BASE_URL: ${TESLA_FLEET_API_BASE_URL:-}
      ODOVI_LOCATION_PROVIDER_WEATHER_CREDENTIAL: ${ODOVI_LOCATION_PROVIDER_WEATHER_CREDENTIAL:-}
      ODOVI_LOCATION_PROVIDER_ELEVATION_CREDENTIAL: ${ODOVI_LOCATION_PROVIDER_ELEVATION_CREDENTIAL:-}
      ODOVI_LOCATION_PROVIDER_MAP_TILES_CREDENTIAL: ${ODOVI_LOCATION_PROVIDER_MAP_TILES_CREDENTIAL:-}
      ODOVI_LOCATION_PROVIDER_ADDRESS_SEARCH_CREDENTIAL: ${ODOVI_LOCATION_PROVIDER_ADDRESS_SEARCH_CREDENTIAL:-}
      ODOVI_LOCATION_PROVIDER_ROUTING_CREDENTIAL: ${ODOVI_LOCATION_PROVIDER_ROUTING_CREDENTIAL:-}
      ODOVI_LOCATION_PROVIDER_EXTERNAL_NAVIGATION_CREDENTIAL: ${ODOVI_LOCATION_PROVIDER_EXTERNAL_NAVIGATION_CREDENTIAL:-}
    depends_on:
      config-check:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
      args:
        ODOVI_VERSION: ${ODOVI_VERSION:-0.3.0}
        ODOVI_COMMIT_SHA: ${ODOVI_COMMIT_SHA:-dev}
    image: odovi-worker:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${ODOVI_DB_USER:-odovi}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${ODOVI_DB_NAME:-odovi}
      TESLAMATE_DATABASE_URL: ${TESLAMATE_DATABASE_URL:?Set TESLAMATE_DATABASE_URL in .env}
      APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Zurich}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-60}
      ELEVATION_MAX_POINTS_PER_CYCLE: ${ELEVATION_MAX_POINTS_PER_CYCLE:-}
      ODOVI_LOCATION_PROVIDER_WEATHER_CREDENTIAL: ${ODOVI_LOCATION_PROVIDER_WEATHER_CREDENTIAL:-}
      ODOVI_LOCATION_PROVIDER_ELEVATION_CREDENTIAL: ${ODOVI_LOCATION_PROVIDER_ELEVATION_CREDENTIAL:-}
      ODOVI_LOCATION_PROVIDER_MAP_TILES_CREDENTIAL: ${ODOVI_LOCATION_PROVIDER_MAP_TILES_CREDENTIAL:-}
      ODOVI_LOCATION_PROVIDER_ADDRESS_SEARCH_CREDENTIAL: ${ODOVI_LOCATION_PROVIDER_ADDRESS_SEARCH_CREDENTIAL:-}
      ODOVI_LOCATION_PROVIDER_ROUTING_CREDENTIAL: ${ODOVI_LOCATION_PROVIDER_ROUTING_CREDENTIAL:-}
      ODOVI_LOCATION_PROVIDER_EXTERNAL_NAVIGATION_CREDENTIAL: ${ODOVI_LOCATION_PROVIDER_EXTERNAL_NAVIGATION_CREDENTIAL:-}
    depends_on:
      config-check:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # No published port — sync loop only, no inbound traffic.
    # A sync slice may contain bounded provider backfills; allow it to finish
    # after SIGTERM before Docker escalates to SIGKILL.
    stop_grace_period: 10m

volumes:
  odovi-db-data:
    name: ${ODOVI_DB_VOLUME_NAME:-odovi-db-data}

# Uncomment if TeslaMate runs on this same Docker host and you want to reach
# it via its Compose network instead of a LAN/Tailscale host address:
#
# networks:
#   default:
#     name: odovi_default
#   teslamate:
#     name: teslamate_default
#     external: true
#
# ...and add `networks: [default, teslamate]` to the `worker` service so it
# can resolve the TeslaMate db service by its Compose service name.
